name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend security and domain test suite
        env:
          NODE_ENV: test
          PAYMENT_PROVIDER: moyasar
          MOYASAR_ENV: test
          MOYASAR_SECRET_KEY: sk_test_ci_placeholder
          MOYASAR_PUBLISHABLE_KEY: pk_test_ci_placeholder
          MOYASAR_WEBHOOK_SECRET: whsec_test_ci_placeholder
        run: npm test

      - name: Run offline airport and service pricing test suite
        env:
          NODE_ENV: test
        run: node tests/pricing.test.js

  frontend:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end/Nextify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Front-end/Nextify/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite production build
        run: npm run build
